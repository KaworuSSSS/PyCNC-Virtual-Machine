<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PyCNC Studio</title>

<link rel="stylesheet" href="css/cnc.css">

</head>

<body>

<div id="viewport"></div>

<div id="hud">

    <div class="title">
        PyCNC Studio
    </div>

    <div class="subtitle">
        VIRTUAL CNC • MILLING MACHINE
    </div>

    <div class="separator"></div>

    <div class="coordinate">

        <span class="axis-x">X</span>

        <span>
            <b id="x">0.00</b> mm
        </span>

    </div>

    <div class="coordinate">

        <span class="axis-y">Y</span>

        <span>
            <b id="y">0.00</b> mm
        </span>

    </div>

    <div class="coordinate">

        <span class="axis-z">Z</span>

        <span>
            <b id="z">0.00</b> mm
        </span>

    </div>

    <div class="separator"></div>

    <div class="status">

        <span class="status-dot"></span>

        <span id="statusText">
            READY
        </span>

    </div>

</div>


<div id="controls">

    <div class="control-title">
        MACHINE CONTROL
    </div>

    <button id="start">
        ▶ START
    </button>

    <button id="pause">
        Ⅱ PAUSE
    </button>

    <button id="stop">
        ■ STOP
    </button>

    <button id="home">
        ⌂ HOME
    </button>

    <label>
        VELOCIDAD
    </label>

    <input
        id="speed"
        type="range"
        min="0.2"
        max="3"
        step="0.1"
        value="1"
    >

</div>


<div id="jog">

    <div class="control-title">
        MANUAL JOG
    </div>

    <div class="jog-step">

        <span>
            STEP
        </span>

        <button
            class="step active"
            data-step="0.1"
        >
            0.1
        </button>

        <button
            class="step"
            data-step="1"
        >
            1
        </button>

        <button
            class="step"
            data-step="10"
        >
            10
        </button>

        <span>
            mm
        </span>

    </div>

    <div class="jog-grid">

        <div></div>

        <button
            class="jog-btn y"
            data-axis="y"
            data-dir="1"
        >
            Y+
        </button>

        <div></div>

        <button
            class="jog-btn x"
            data-axis="x"
            data-dir="-1"
        >
            X−
        </button>

        <button
            class="home-mini"
            id="jogHome"
        >
            HOME
        </button>

        <button
            class="jog-btn x"
            data-axis="x"
            data-dir="1"
        >
            X+
        </button>

        <div></div>

        <button
            class="jog-btn y"
            data-axis="y"
            data-dir="-1"
        >
            Y−
        </button>

        <div></div>

    </div>

    <div class="z-controls">

        <button
            class="jog-btn z"
            data-axis="z"
            data-dir="1"
        >
            Z+
        </button>

        <button
            class="jog-btn z"
            data-axis="z"
            data-dir="-1"
        >
            Z−
        </button>

    </div>

</div>


<div id="help">

    Arrastra: rotar<br>
    Rueda: zoom<br>
    Botón derecho: desplazar<br>
    Teclado: A/D X • W/S Y • R/F Z

</div>


<div id="error">

    <h3>
        Error 3D
    </h3>

    <pre id="errorText"></pre>

</div>


<script type="importmap">

{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}

</script>

<script src="js/machine-config.js"></script>
<script src="js/error-handler.js"></script>
<script src="js/machine-3d.js"></script>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

import {
    mat,
    box,
    cylinder,
    addBox
} from "./js/geometry.js";

/* SCENE */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x0d1115
    );

scene.fog =
    new THREE.Fog(
        0x0d1115,
        900,
        3000
    );


/* CAMERA */

const camera =
    new THREE.PerspectiveCamera(

        40,

        innerWidth /
        innerHeight,

        1,

        5000

    );

camera.position.set(
    1450,
    1200,
    1600
);


/* RENDERER */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("viewport")
    .appendChild(
        renderer.domElement
    );


/* CAMERA CONTROLS */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.target.set(
    WORK_AREA.X / 2,
    450,
    WORK_AREA.Y / 2
);

controls.enableDamping =
    true;

controls.dampingFactor =
    0.055;

controls.minDistance =
    500;

controls.maxDistance =
    3500;


/* LIGHTS */

scene.add(
    new THREE.HemisphereLight(
        0xe8eef2,
        0x161b20,
        2.0
    )
);

const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        3.5
    );

keyLight.position.set(
    900,
    1800,
    1000
);

keyLight.castShadow =
    true;

keyLight.shadow.mapSize.set(
    2048,
    2048
);

scene.add(
    keyLight
);

const fillLight =
    new THREE.DirectionalLight(
        0x8ca9c7,
        1.1
    );

fillLight.position.set(
    -900,
    900,
    -900
);

scene.add(
    fillLight
);


/* MATERIALS */

function mat(
    color,
    metalness,
    roughness
) {

    return new THREE.MeshStandardMaterial({

        color,
        metalness,
        roughness

    });

}

const aluminum =
    mat(
        0x626b70,
        0.85,
        0.28
    );

const aluminumDark =
    mat(
        0x272d31,
        0.90,
        0.22
    );

const aluminumLight =
    mat(
        0x929b9f,
        0.90,
        0.20
    );

const black =
    mat(
        0x101315,
        0.88,
        0.20
    );

const steel =
    mat(
        0xb8c0c4,
        0.94,
        0.15
    );

const yellow =
    mat(
        0xd5a72a,
        0.55,
        0.30
    );

const workMaterial =
    mat(
        0x8a5530,
        0.10,
        0.65
    );


/* GEOMETRY */









/* MACHINE */

const cnc =
    new THREE.Group();

scene.add(
    cnc
);


/* BASE */

addBox(

    cnc,

    WORK_AREA.X + 180,
    60,
    WORK_AREA.Y + 180,

    aluminumDark,

    WORK_AREA.X / 2,
    30,
    WORK_AREA.Y / 2

);


/* TABLE */

addBox(

    cnc,

    WORK_AREA.X,
    MACHINE.tableThickness,
    WORK_AREA.Y,

    aluminumLight,

    WORK_AREA.X / 2,
    TABLE_Y,
    WORK_AREA.Y / 2

);

const TABLE_TOP =
    TABLE_Y +
    MACHINE.tableThickness / 2;


/* WORK SURFACE */

addBox(

    cnc,

    WORK_AREA.X - 40,
    8,
    WORK_AREA.Y - 40,

    black,

    WORK_AREA.X / 2,
    TABLE_TOP + 4,
    WORK_AREA.Y / 2

);


/* T SLOTS */

for (
    let x = 50;
    x < WORK_AREA.X;
    x += 50
) {

    addBox(

        cnc,

        4,
        2,
        WORK_AREA.Y - 60,

        aluminumLight,

        x,
        TABLE_TOP + 9,
        WORK_AREA.Y / 2

    );

}


/* WORKPIECE */

const workpiece =
    addBox(

        cnc,

        420,
        35,
        260,

        workMaterial,

        WORK_AREA.X / 2,
        TABLE_TOP + 26,
        WORK_AREA.Y / 2

    );


/* VISE */

addBox(
    cnc,
    500,
    20,
    330,
    aluminumDark,
    WORK_AREA.X / 2,
    TABLE_TOP + 14,
    WORK_AREA.Y / 2
);

addBox(
    cnc,
    25,
    90,
    330,
    steel,
    WORK_AREA.X / 2 - 230,
    TABLE_TOP + 65,
    WORK_AREA.Y / 2
);

addBox(
    cnc,
    25,
    90,
    330,
    steel,
    WORK_AREA.X / 2 + 230,
    TABLE_TOP + 65,
    WORK_AREA.Y / 2
);


/* COLUMNS */

const columnHeight =
    MACHINE.frameHeight;

const columnY =
    TABLE_TOP +
    columnHeight / 2;

for (
    const x of [
        35,
        WORK_AREA.X - 35
    ]
) {

    for (
        const z of [
            35,
            WORK_AREA.Y - 35
        ]
    ) {

        addBox(

            cnc,

            MACHINE.columnSize,
            columnHeight,
            MACHINE.columnSize,

            aluminum,

            x,
            columnY,
            z

        );

        addBox(

            cnc,

            MACHINE.columnSize + 25,
            35,
            MACHINE.columnSize + 25,

            aluminumDark,

            x,
            TABLE_TOP + 20,
            z

        );

    }

}


/* UPPER FRAME */

const FRAME_TOP =
    TABLE_TOP +
    columnHeight;

addBox(

    cnc,

    WORK_AREA.X + 70,
    80,
    100,

    aluminumDark,

    WORK_AREA.X / 2,
    FRAME_TOP,
    40

);

addBox(

    cnc,

    WORK_AREA.X + 70,
    80,
    100,

    aluminumDark,

    WORK_AREA.X / 2,
    FRAME_TOP,
    WORK_AREA.Y - 40

);


/* GANTRY */

const gantry =
    new THREE.Group();

cnc.add(
    gantry
);

gantry.position.set(
    0,
    0,
    0
);


/* GANTRY BEAM */

addBox(

    gantry,

    WORK_AREA.X + 30,
    90,
    100,

    aluminum,

    WORK_AREA.X / 2,
    FRAME_TOP - 120,
    0

);


/* GANTRY SIDE PLATES */

addBox(
    gantry,
    60,
    180,
    110,
    aluminumDark,
    45,
    FRAME_TOP - 190,
    0
);

addBox(
    gantry,
    60,
    180,
    110,
    aluminumDark,
    WORK_AREA.X - 45,
    FRAME_TOP - 190,
    0
);


/* Y RAILS */

for (
    const x of [
        180,
        WORK_AREA.X - 180
    ]
) {

    const rail =
        cylinder(
            16,
            WORK_AREA.Y,
            steel
        );

    rail.rotation.x =
        Math.PI / 2;

    rail.position.set(
        x,
        FRAME_TOP - 100,
        WORK_AREA.Y / 2
    );

    cnc.add(
        rail
    );

}


/* CARRIAGE */

const carriage =
    new THREE.Group();

gantry.add(
    carriage
);

carriage.position.x =
    WORK_AREA.X / 2;


/* CARRIAGE BODY */

addBox(

    carriage,

    180,
    180,
    130,

    aluminumDark,

    0,
    FRAME_TOP - 220,
    0

);

addBox(

    carriage,

    150,
    100,
    150,

    aluminum,

    0,
    FRAME_TOP - 340,
    0

);


/* X RAILS */

for (
    const y of [
        FRAME_TOP - 270,
        FRAME_TOP - 340
    ]
) {

    const rail =
        cylinder(
            14,
            WORK_AREA.X,
            steel
        );

    rail.rotation.z =
        Math.PI / 2;

    rail.position.set(
        WORK_AREA.X / 2,
        y,
        -70
    );

    gantry.add(
        rail
    );

}


/* Z AXIS */

const zAxis =
    new THREE.Group();

carriage.add(
    zAxis
);

let machineZ =
    WORK_AREA.Z;


/* Z BODY */

addBox(

    zAxis,

    MACHINE.spindleWidth,
    360,
    MACHINE.spindleDepth,

    black,

    0,
    0,
    0

);


/* Z GUIDE RODS */

for (
    const x of [-30, 30]
) {

    const rod =
        cylinder(
            12,
            360,
            steel
        );

    rod.position.set(
        x,
        0,
        -65
    );

    zAxis.add(
        rod
    );

}


/* SPINDLE */

const spindle =
    new THREE.Group();

zAxis.add(
    spindle
);


/* SPINDLE BODY */

const spindleBody =
    cylinder(
        42,
        180,
        black
    );

spindleBody.position.y =
    -40;

spindle.add(
    spindleBody
);


/* SPINDLE TOP */

const spindleTop =
    cylinder(
        48,
        45,
        aluminum
    );

spindleTop.position.y =
    70;

spindle.add(
    spindleTop
);


/* MOTOR */

const motor =
    cylinder(
        55,
        90,
        aluminumDark
    );

motor.position.y =
    135;

spindle.add(
    motor
);


/* MOTOR RINGS */

for (
    let y = 95;
    y <= 165;
    y += 15
) {

    const ring =
        cylinder(
            58,
            5,
            aluminum
        );

    ring.position.y =
        y;

    spindle.add(
        ring
    );

}


/* TOOL ROTATION */

const toolRotation =
    new THREE.Group();

spindle.add(
    toolRotation
);


/* SHAFT */

const shaft =
    cylinder(
        16,
        80,
        steel
    );

shaft.position.y =
    -155;

toolRotation.add(
    shaft
);


/* COLLET */

const collet =
    cylinder(
        20,
        35,
        steel
    );

collet.position.y =
    -210;

toolRotation.add(
    collet
);


/* CUTTER */

const cutter =
    cylinder(
        8,
        MACHINE.toolLength,
        steel
    );

cutter.position.y =
    -285;

toolRotation.add(
    cutter
);


/* TOOL TIP */

const toolTip =
    cylinder(
        9,
        20,
        yellow
    );

toolTip.position.y =
    -355;

toolRotation.add(
    toolTip
);


/* TOOL POSITION */

const toolWorld =
    new THREE.Vector3();


/* MACHINE POSITION */

function applyMachinePosition() {

    carriage.position.x =
        machineX;

    gantry.position.z =
        machineY;

    const zTravel =
        WORK_AREA.Z -
        machineZ;

    zAxis.position.y =
        zTravel;

    enforceToolLimit();

}


/* MACHINE COORDINATES */

let machineX =
    WORK_AREA.X / 2;

let machineY =
    WORK_AREA.Y / 2;


/* TOOL SAFETY */

function enforceToolLimit() {

    toolTip.getWorldPosition(
        toolWorld
    );

    if (
        toolWorld.y <
        TABLE_TOP
    ) {

        const correction =
            TABLE_TOP -
            toolWorld.y;

        zAxis.position.y +=
            correction;

        machineZ =
            THREE.MathUtils.clamp(

                WORK_AREA.Z -
                zAxis.position.y,

                LIMITS.Z_MIN,
                LIMITS.Z_MAX

            );

    }

}


/* CLAMP */

function clampMachine() {

    machineX =
        THREE.MathUtils.clamp(
            machineX,
            LIMITS.X_MIN,
            LIMITS.X_MAX
        );

    machineY =
        THREE.MathUtils.clamp(
            machineY,
            LIMITS.Y_MIN,
            LIMITS.Y_MAX
        );

    machineZ =
        THREE.MathUtils.clamp(
            machineZ,
            LIMITS.Z_MIN,
            LIMITS.Z_MAX
        );

    applyMachinePosition();

}


/* HUD */

function updateHUD() {

    document
        .getElementById("x")
        .textContent =
        machineX.toFixed(2);

    document
        .getElementById("y")
        .textContent =
        machineY.toFixed(2);

    document
        .getElementById("z")
        .textContent =
        machineZ.toFixed(2);

}


function setStatus(text) {

    document
        .getElementById("statusText")
        .textContent =
        text;

}


/* TOOL PATH */

const pathPoints =
    [];

const pathGeometry =
    new THREE.BufferGeometry();

const pathMaterial =
    new THREE.LineBasicMaterial({

        color: 0xff4545,

        transparent: true,

        opacity: 0.8

    });

const toolPath =
    new THREE.Line(
        pathGeometry,
        pathMaterial
    );

scene.add(
    toolPath
);


function recordPath() {

    toolTip.getWorldPosition(
        toolWorld
    );

    pathPoints.push(
        toolWorld.clone()
    );

    if (
        pathPoints.length >
        1200
    ) {

        pathPoints.shift();

    }

    pathGeometry.setFromPoints(
        pathPoints
    );

}


/* MACHINE STATE */

const state = {

    running: false,

    paused: false,

    stopped: false,

    time: 0,

    speed: 1

};


/* AUTOMATIC SIMULATION */

function simulate(delta) {

    if (
        !state.running ||
        state.paused ||
        state.stopped
    ) {

        return;

    }

    state.time +=
        delta *
        state.speed;

    machineX =

        WORK_AREA.X / 2 +

        Math.sin(
            state.time * 0.7
        ) *
        (WORK_AREA.X * 0.38);

    machineY =

        WORK_AREA.Y / 2 +

        Math.sin(
            state.time * 0.45
        ) *
        (WORK_AREA.Y * 0.38);

    machineZ =

        120 +

        Math.max(
            0,
            Math.sin(
                state.time * 1.1
            )
        ) *
        220;

    clampMachine();

    toolRotation.rotation.y +=

        delta *
        18 *
        state.speed;

    updateHUD();

    recordPath();

    if (
        state.time >
        Math.PI * 10
    ) {

        state.running =
            false;

        setStatus(
            "COMPLETED"
        );

    }

}


/* START */

document
    .getElementById("start")
    .onclick =
    () => {

        state.running =
            true;

        state.paused =
            false;

        state.stopped =
            false;

        setStatus(
            "RUNNING"
        );

    };


/* PAUSE */

document
    .getElementById("pause")
    .onclick =
    () => {

        if (
            state.running
        ) {

            state.paused =
                true;

            setStatus(
                "PAUSED"
            );

        }

    };


/* STOP */

document
    .getElementById("stop")
    .onclick =
    () => {

        state.running =
            false;

        state.paused =
            false;

        state.stopped =
            true;

        setStatus(
            "STOPPED"
        );

    };


/* HOME */

function goHome() {

    state.running =
        false;

    state.paused =
        false;

    state.stopped =
        false;

    state.time =
        0;

    machineX =
        0;

    machineY =
        0;

    machineZ =
        WORK_AREA.Z;

    toolRotation.rotation.y =
        0;

    pathPoints.length =
        0;

    pathGeometry.setFromPoints(
        []
    );

    clampMachine();

    updateHUD();

    setStatus(
        "READY"
    );

}

document
    .getElementById("home")
    .onclick =
    goHome;


/* SPEED */

document
    .getElementById("speed")
    .oninput =
    event => {

        state.speed =
            parseFloat(
                event.target.value
            );

    };


/* JOG STEP */

let jogStep =
    0.1;

document
    .querySelectorAll(".step")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    jogStep =
                        parseFloat(
                            button.dataset.step
                        );

                    document
                        .querySelectorAll(".step")
                        .forEach(
                            b => {

                                b.classList.remove(
                                    "active"
                                );

                            }
                        );

                    button.classList.add(
                        "active"
                    );

                }
            );

        }
    );


/* MANUAL JOG */

function jogAxis(
    axis,
    direction
) {

    state.running =
        false;

    state.paused =
        false;

    state.stopped =
        false;

    const distance =
        jogStep *
        direction;

    if (
        axis === "x"
    ) {

        machineX +=
            distance;

    }

    if (
        axis === "y"
    ) {

        machineY +=
            distance;

    }

    if (
        axis === "z"
    ) {

        machineZ +=
            distance;

    }

    clampMachine();

    updateHUD();

    setStatus(
        "JOG"
    );

}


/* JOG BUTTONS */

document
    .querySelectorAll(".jog-btn")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    jogAxis(

                        button.dataset.axis,

                        parseInt(
                            button.dataset.dir
                        )

                    );

                }
            );

        }
    );


/* JOG HOME */

document
    .getElementById("jogHome")
    .addEventListener(
        "click",
        goHome
    );


/* KEYBOARD */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName ===
            "INPUT"
        ) {

            return;

        }

        const key =
            event.key.toLowerCase();

        if (key === "a") {

            jogAxis(
                "x",
                -1
            );

        }

        if (key === "d") {

            jogAxis(
                "x",
                1
            );

        }

        if (key === "w") {

            jogAxis(
                "y",
                1
            );

        }

        if (key === "s") {

            jogAxis(
                "y",
                -1
            );

        }

        if (key === "r") {

            jogAxis(
                "z",
                1
            );

        }

        if (key === "f") {

            jogAxis(
                "z",
                -1
            );

        }

    }
);


/* INITIAL POSITION */

goHome();


/* RESIZE */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* ANIMATION */

let previous =
    performance.now();

function animate(now) {

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(

            (now - previous) /
            1000,

            0.05

        );

    previous =
        now;

    simulate(
        delta
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate(
    performance.now()
);

</script>

</body>
