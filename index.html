<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PyCNC Studio</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090c0f;
    font-family: Arial, Helvetica, sans-serif;
}

#viewport {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}


/* =========================================================
   HUD
   ========================================================= */

#hud {
    position: fixed;
    z-index: 20;

    top: 18px;
    left: 18px;

    width: 255px;

    padding: 18px;

    color: #e9edf0;

    background: rgba(10,14,18,.90);

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 12px;

    box-shadow: 0 20px 60px rgba(0,0,0,.45);

    backdrop-filter: blur(14px);
}

.title {
    font-size: 22px;
    font-weight: 700;
}

.subtitle {
    margin-top: 4px;
    color: #7e8991;
    font-size: 9px;
    letter-spacing: 3px;
}

.separator {
    height: 1px;
    margin: 15px 0;
    background: rgba(255,255,255,.09);
}

.coordinate {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    font-size: 13px;
}

.axis-x {
    color: #ef6666;
    font-weight: bold;
}

.axis-y {
    color: #62d48a;
    font-weight: bold;
}

.axis-z {
    color: #70a8ef;
    font-weight: bold;
}

.coordinate b {
    font-family: Consolas, monospace;
    font-size: 14px;
}

.status {
    font-size: 10px;
    letter-spacing: 2px;
}

.status-dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #45d27a;

    box-shadow: 0 0 10px #45d27a;
}


/* =========================================================
   CONTROL
   ========================================================= */

#controls {

    position: fixed;
    z-index: 20;

    top: 18px;
    right: 18px;

    width: 215px;

    padding: 15px;

    color: white;

    background: rgba(10,14,18,.90);

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 12px;

    backdrop-filter: blur(14px);
}

.control-title {
    margin-bottom: 10px;

    color: #7e8991;

    font-size: 9px;

    letter-spacing: 2px;
}

button {

    width: 100%;

    margin: 3px 0;

    padding: 10px;

    border: 0;

    border-radius: 6px;

    background: #252c31;

    color: #e8ecef;

    cursor: pointer;

    font-size: 11px;

    font-weight: bold;

    transition: background .12s, transform .08s;
}

button:hover {
    background: #343d43;
}

button:active {
    transform: scale(.97);
}

#start:hover {
    background: #245e3b;
}

#stop:hover {
    background: #712b31;
}

label {

    display: block;

    margin-top: 13px;
    margin-bottom: 6px;

    color: #8e989f;

    font-size: 10px;

    letter-spacing: 1px;
}

input[type="range"] {
    width: 100%;
}


/* =========================================================
   JOG
   ========================================================= */

#jog {

    position: fixed;

    z-index: 20;

    left: 18px;
    bottom: 18px;

    width: 255px;

    padding: 15px;

    color: white;

    background: rgba(10,14,18,.90);

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 12px;

    backdrop-filter: blur(14px);

    box-shadow: 0 20px 60px rgba(0,0,0,.40);
}

.jog-step {

    display: flex;

    align-items: center;

    gap: 5px;

    margin-bottom: 13px;

    color: #7e8991;

    font-size: 9px;

    letter-spacing: 1px;
}

.jog-step .step {

    width: auto;

    margin: 0;

    padding: 6px 8px;

    font-size: 9px;

    color: #9ca5aa;

    background: #20262a;
}

.jog-step .step.active {

    background: #3d687b;

    color: white;
}

.jog-grid {

    display: grid;

    grid-template-columns: 1fr 1fr 1fr;

    gap: 5px;
}

.jog-btn,
.home-mini {

    height: 42px;

    margin: 0;

    border-radius: 6px;

    font-family: Consolas, monospace;

    font-size: 12px;

    font-weight: bold;
}

.jog-btn.x {
    color: #ef7777;
}

.jog-btn.y {
    color: #70d694;
}

.jog-btn.z {
    color: #79aef0;
}

.jog-btn:hover {
    background: #343d43;
}

.jog-btn:active {

    transform: scale(.96);

    background: #465158;
}

.home-mini {

    color: #d7dde0;

    background: #252c31;
}

.z-controls {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 5px;

    margin-top: 5px;
}

.z-controls .jog-btn {
    height: 38px;
}


/* =========================================================
   HELP
   ========================================================= */

#help {

    position: fixed;

    right: 18px;
    bottom: 16px;

    z-index: 20;

    padding: 8px 12px;

    color: #737e85;

    background: rgba(8,11,14,.78);

    border-radius: 7px;

    font-size: 10px;

    line-height: 1.6;
}


/* =========================================================
   ERROR
   ========================================================= */

#error {

    display: none;

    position: fixed;

    z-index: 100;

    top: 50%;
    left: 50%;

    transform: translate(-50%,-50%);

    width: min(720px,90vw);

    padding: 22px;

    color: white;

    background: #291519;

    border: 1px solid #87414c;

    border-radius: 12px;
}

#error h3 {
    margin-top: 0;
}

#error pre {
    white-space: pre-wrap;
    font-size: 12px;
}

</style>

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =========================================================
   WORK AREA
   =========================================================

   TODO EL PROYECTO TRABAJA EN MILÍMETROS.

   1100 mm = 110 cm
    700 mm =  70 cm
    700 mm =  70 cm
   ========================================================= */

const WORK_AREA = {

    X: 1100,

    Y: 700,

    Z: 700

};


/* =========================================================
   MACHINE LIMITS
   ========================================================= */

const LIMITS = {

    X_MIN: 0,

    X_MAX: WORK_AREA.X,

    Y_MIN: 0,

    Y_MAX: WORK_AREA.Y,

    Z_MIN: 0,

    Z_MAX: WORK_AREA.Z

};


/* =========================================================
   MACHINE DIMENSIONS
   ========================================================= */

const MACHINE = {

    tableX: WORK_AREA.X,

    tableY: WORK_AREA.Y,

    tableThickness: 40,

    frameHeight: 850,

    columnSize: 70,

    gantryThickness: 70,

    gantryDepth: 100,

    spindleWidth: 90,

    spindleDepth: 90,

    toolLength: 120

};


/* =========================================================
   ERROR HANDLING
   ========================================================= */

function showError(error) {

    console.error(error);

    document
        .getElementById("error")
        .style.display = "block";

    document
        .getElementById("errorText")
        .textContent =
        String(
            error?.stack ||
            error
        );

}

window.addEventListener(
    "error",
    event => {

        if (event.error) {

            showError(
                event.error
            );

        }

    }
);

window.addEventListener(
    "unhandledrejection",
    event => {

        showError(
            event.reason
        );

    }
);


/* =========================================================
   SCENE
   ========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x0d1115
    );

scene.fog =
    new THREE.Fog(
        0x0d1115,
        900,
        3000
    );


/* =========================================================
   CAMERA
   ========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        40,

        innerWidth /
        innerHeight,

        1,

        5000

    );

camera.position.set(
    1450,
    1200,
    1600
);


/* =========================================================
   RENDERER
   ========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("viewport")
    .appendChild(
        renderer.domElement
    );


/* =========================================================
   CAMERA CONTROLS
   ========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.target.set(
    WORK_AREA.X / 2,
    450,
    WORK_AREA.Y / 2
);

controls.enableDamping =
    true;

controls.dampingFactor =
    0.055;

controls.minDistance =
    500;

controls.maxDistance =
    3500;


/* =========================================================
   LIGHTS
   ========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xe8eef2,
        0x161b20,
        2.0
    )
);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        3.5
    );

keyLight.position.set(
    900,
    1800,
    1000
);

keyLight.castShadow =
    true;

keyLight.shadow.mapSize.set(
    2048,
    2048
);

scene.add(
    keyLight
);


const fillLight =
    new THREE.DirectionalLight(
        0x8ca9c7,
        1.1
    );

fillLight.position.set(
    -900,
    900,
    -900
);

scene.add(
    fillLight
);


/* =========================================================
   MATERIALS
   ========================================================= */

function mat(
    color,
    metalness,
    roughness
) {

    return new THREE.MeshStandardMaterial({

        color,
        metalness,
        roughness

    });

}


const aluminum =
    mat(
        0x626b70,
        0.85,
        0.28
    );

const aluminumDark =
    mat(
        0x272d31,
        0.90,
        0.22
    );

const aluminumLight =
    mat(
        0x929b9f,
        0.90,
        0.20
    );

const black =
    mat(
        0x101315,
        0.88,
        0.20
    );

const steel =
    mat(
        0xb8c0c4,
        0.94,
        0.15
    );

const rubber =
    mat(
        0x0b0d0f,
        0.15,
        0.78
    );

const yellow =
    mat(
        0xd5a72a,
        0.55,
        0.30
    );

const workMaterial =
    mat(
        0x8a5530,
        0.10,
        0.65
    );


/* =========================================================
   GEOMETRY
   ========================================================= */

function box(
    x,
    y,
    z,
    material
) {

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                x,
                y,
                z
            ),

            material

        );

    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;

    return mesh;

}


function cylinder(
    radius,
    height,
    material,
    segments = 32
) {

    const mesh =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                segments
            ),

            material

        );

    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;

    return mesh;

}


function addBox(
    parent,
    sx,
    sy,
    sz,
    material,
    px,
    py,
    pz
) {

    const mesh =
        box(
            sx,
            sy,
            sz,
            material
        );

    mesh.position.set(
        px,
        py,
        pz
    );

    parent.add(
        mesh
    );

    return mesh;

}


/* =========================================================
   MACHINE ROOT
   ========================================================= */

const cnc =
    new THREE.Group();

scene.add(
    cnc
);


/*
 * Usaremos:
 *
 * X = izquierda/derecha
 * Y = altura
 * Z = profundidad
 *
 * El origen de trabajo estará en:
 *
 * X = 0
 * Z = 0
 * Y = superficie de mesa
 */


const TABLE_Y =
    80;


/* =========================================================
   BASE
   ========================================================= */

addBox(

    cnc,

    WORK_AREA.X + 180,

    60,

    WORK_AREA.Y + 180,

    aluminumDark,

    WORK_AREA.X / 2,

    30,

    WORK_AREA.Y / 2

);


/* =========================================================
   TABLE
   ========================================================= */

addBox(

    cnc,

    WORK_AREA.X,

    MACHINE.tableThickness,

    WORK_AREA.Y,

    aluminumLight,

    WORK_AREA.X / 2,

    TABLE_Y,

    WORK_AREA.Y / 2

);


/* =========================================================
   WORK SURFACE
   ========================================================= */

const TABLE_TOP =
    TABLE_Y +
    MACHINE.tableThickness / 2;


addBox(

    cnc,

    WORK_AREA.X - 40,

    8,

    WORK_AREA.Y - 40,

    black,

    WORK_AREA.X / 2,

    TABLE_TOP + 4,

    WORK_AREA.Y / 2

);


/* =========================================================
   T SLOTS
   ========================================================= */

for (
    let x = 50;
    x < WORK_AREA.X;
    x += 50
) {

    addBox(

        cnc,

        4,

        2,

        WORK_AREA.Y - 60,

        aluminumLight,

        x,

        TABLE_TOP + 9,

        WORK_AREA.Y / 2

    );

}


/* =========================================================
   WORKPIECE
   ========================================================= */

const workpiece =
    addBox(

        cnc,

        420,

        35,

        260,

        workMaterial,

        WORK_AREA.X / 2,

        TABLE_TOP + 26,

        WORK_AREA.Y / 2

    );


/* =========================================================
   VISE
   ========================================================= */

addBox(
    cnc,
    500,
    20,
    330,
    aluminumDark,
    WORK_AREA.X / 2,
    TABLE_TOP + 14,
    WORK_AREA.Y / 2
);

addBox(
    cnc,
    25,
    90,
    330,
    steel,
    WORK_AREA.X / 2 - 230,
    TABLE_TOP + 65,
    WORK_AREA.Y / 2
);

addBox(
    cnc,
    25,
    90,
    330,
    steel,
    WORK_AREA.X / 2 + 230,
    TABLE_TOP + 65,
    WORK_AREA.Y / 2
);


/* =========================================================
   COLUMNS
   ========================================================= */

const columnHeight =
    MACHINE.frameHeight;

const columnY =
    TABLE_TOP +
    columnHeight / 2;


for (
    const x of [
        35,
        WORK_AREA.X - 35
    ]
) {

    for (
        const z of [
            35,
            WORK_AREA.Y - 35
        ]
    ) {

        addBox(

            cnc,

            MACHINE.columnSize,

            columnHeight,

            MACHINE.columnSize,

            aluminum,

            x,

            columnY,

            z

        );

        addBox(

            cnc,

            MACHINE.columnSize + 25,

            35,

            MACHINE.columnSize + 25,

            aluminumDark,

            x,

            TABLE_TOP + 20,

            z

        );

    }

}


/* =========================================================
   UPPER FRAME
   ========================================================= */

const FRAME_TOP =
    TABLE_TOP +
    columnHeight;


addBox(

    cnc,

    WORK_AREA.X + 70,

    80,

    100,

    aluminumDark,

    WORK_AREA.X / 2,

    FRAME_TOP,

    40

);

addBox(

    cnc,

    WORK_AREA.X + 70,

    80,

    100,

    aluminumDark,

    WORK_AREA.X / 2,

    FRAME_TOP,

    WORK_AREA.Y - 40

);


/* =========================================================
   GANTRY
   ========================================================= */

const gantry =
    new THREE.Group();

cnc.add(
    gantry
);


/*
 * gantry.position.x
 * = coordenada CNC X
 *
 * gantry.position.z
 * = coordenada CNC Y
 */


gantry.position.set(
    0,
    0,
    0
);


/* =========================================================
   GANTRY BEAM
   ========================================================= */

const gantryBeam =
    addBox(

        gantry,

        WORK_AREA.X + 30,

        90,

        100,

        aluminum,

        WORK_AREA.X / 2,

        FRAME_TOP - 120,

        0

    );


/* =========================================================
   GANTRY SIDE PLATES
   ========================================================= */

addBox(
    gantry,
    60,
    180,
    110,
    aluminumDark,
    45,
    FRAME_TOP - 190,
    0
);

addBox(
    gantry,
    60,
    180,
    110,
    aluminumDark,
    WORK_AREA.X - 45,
    FRAME_TOP - 190,
    0
);


/* =========================================================
   Y RAILS
   ========================================================= */

for (
    const x of [
        180,
        WORK_AREA.X - 180
    ]
) {

    const rail =
        cylinder(
            16,
            WORK_AREA.Y,
            steel
        );

    rail.rotation.x =
        Math.PI / 2;

    rail.position.set(
        x,
        FRAME_TOP - 100,
        WORK_AREA.Y / 2
    );

    cnc.add(
        rail
    );

}


/* =========================================================
   CARRIAGE
   ========================================================= */

const carriage =
    new THREE.Group();

gantry.add(
    carriage
);


/*
 * carriage.position.x
 * representa el movimiento X
 */

carriage.position.x =
    WORK_AREA.X / 2;


/* =========================================================
   CARRIAGE BODY
   ========================================================= */

addBox(

    carriage,

    180,

    180,

    130,

    aluminumDark,

    0,

    FRAME_TOP - 220,

    0

);

addBox(

    carriage,

    150,

    100,

    150,

    aluminum,

    0,

    FRAME_TOP - 340,

    0

);


/* =========================================================
   X RAILS
   ========================================================= */

for (
    const y of [
        FRAME_TOP - 270,
        FRAME_TOP - 340
    ]
) {

    const rail =
        cylinder(
            14,
            WORK_AREA.X,
            steel
        );

    rail.rotation.z =
        Math.PI / 2;

    rail.position.set(
    	WORK_AREA.X / 2,
   	 y,
    	-70
	);

    gantry.add(
        rail
    );

}


/* =========================================================
   Z AXIS
   ========================================================= */

const zAxis =
    new THREE.Group();

carriage.add(
    zAxis
);


/*
 * Coordenada Z:
 *
 * 0 = herramienta en mesa
 * 700 = herramienta arriba
 */


let machineZ =
    WORK_AREA.Z;


/* =========================================================
   Z BODY
   ========================================================= */

addBox(

    zAxis,

    MACHINE.spindleWidth,

    360,

    MACHINE.spindleDepth,

    black,

    0,

    0,

    0

);


/* =========================================================
   Z GUIDE RODS
   ========================================================= */

for (
    const x of [-30, 30]
) {

    const rod =
        cylinder(
            12,
            360,
            steel
        );

    rod.position.set(
        x,
        0,
        -65
    );

    zAxis.add(
        rod
    );

}


/* =========================================================
   SPINDLE
   ========================================================= */

const spindle =
    new THREE.Group();

zAxis.add(
    spindle
);


/* =========================================================
   SPINDLE BODY
   ========================================================= */

const spindleBody =
    cylinder(
        42,
        180,
        black
    );

spindleBody.position.y =
    -40;

spindle.add(
    spindleBody
);


/* =========================================================
   SPINDLE TOP
   ========================================================= */

const spindleTop =
    cylinder(
        48,
        45,
        aluminum
    );

spindleTop.position.y =
    70;

spindle.add(
    spindleTop
);


/* =========================================================
   MOTOR
   ========================================================= */

const motor =
    cylinder(
        55,
        90,
        aluminumDark
    );

motor.position.y =
    135;

spindle.add(
    motor
);


/* =========================================================
   MOTOR RINGS
   ========================================================= */

for (
    let y = 95;
    y <= 165;
    y += 15
) {

    const ring =
        cylinder(
            58,
            5,
            aluminum
        );

    ring.position.y =
        y;

    spindle.add(
        ring
    );

}


/* =========================================================
   TOOL ROTATION GROUP
   ========================================================= */

const toolRotation =
    new THREE.Group();

spindle.add(
    toolRotation
);


/* =========================================================
   SHAFT
   ========================================================= */

const shaft =
    cylinder(
        16,
        80,
        steel
    );

shaft.position.y =
    -155;

toolRotation.add(
    shaft
);


/* =========================================================
   COLLET
   ========================================================= */

const collet =
    cylinder(
        20,
        35,
        steel
    );

collet.position.y =
    -210;

toolRotation.add(
    collet
);


/* =========================================================
   CUTTER
   ========================================================= */

const cutter =
    cylinder(

        MACHINE.toolLength,

cutter.position.y =
    -285;

    cutter

/* =========================================================
   TOOL TIP
   ========================================================= */

const toolTip =
    cylinder(
        9,
        20,
        yellow
    );

toolTip.position.y =
    -355;

toolRotation.add(
    toolTip
);


/* =========================================================
   TOOL WORLD POSITION
   ========================================================= */

const toolWorld =
    new THREE.Vector3();


/* =========================================================
   POSITIONING
   =========================================================

   La herramienta se coloca de manera que:

   machineZ = 0

   significa que la punta coincide
   exactamente con TABLE_TOP.
   ========================================================= */

function setMachineZ(z) {

    machineZ =
        THREE.MathUtils.clamp(
            z,
            LIMITS.Z_MIN,
            LIMITS.Z_MAX
        );

}


/* =========================================================
   APPLY MACHINE POSITION
   ========================================================= */

function applyMachinePosition() {

    /*
     * X
     */

    carriage.position.x =
        machineX;


    /*
     * Y
     */

    gantry.position.z =
        machineY;


    /*
     * Z
     */

    /*
     * El eje Z se mueve en
     * coordenadas 3D inversas.
     */

    const zTravel =
        WORK_AREA.Z -
        machineZ;

    zAxis.position.y =
        zTravel;


    /*
     * Protección adicional.
     */

    enforceToolLimit();

}


/* =========================================================
   MACHINE COORDINATES
   ========================================================= */

let machineX =
    WORK_AREA.X / 2;

let machineY =
    WORK_AREA.Y / 2;


/* =========================================================
   TOOL SAFETY
   ========================================================= */

function enforceToolLimit() {

    toolTip.getWorldPosition(
        toolWorld
    );


    /*
     * La punta jamás puede estar
     * por debajo de la superficie.
     */

    if (
        toolWorld.y <
        TABLE_TOP
    ) {

        const correction =
            TABLE_TOP -
            toolWorld.y;

        zAxis.position.y +=
            correction;

        /*
         * Volver a calcular Z lógico.
         */

        machineZ =
            THREE.MathUtils.clamp(

                WORK_AREA.Z -
                zAxis.position.y,

                LIMITS.Z_MIN,
                LIMITS.Z_MAX

            );

    }

}


/* =========================================================
   CLAMP ALL AXES
   ========================================================= */

function clampMachine() {

    machineX =
        THREE.MathUtils.clamp(
            machineX,
            LIMITS.X_MIN,
            LIMITS.X_MAX
        );


    machineY =
        THREE.MathUtils.clamp(
            machineY,
            LIMITS.Y_MIN,
            LIMITS.Y_MAX
        );


    machineZ =
        THREE.MathUtils.clamp(
            machineZ,
            LIMITS.Z_MIN,
            LIMITS.Z_MAX
        );


    applyMachinePosition();

}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD() {

    document
        .getElementById("x")
        .textContent =
        machineX.toFixed(2);

    document
        .getElementById("y")
        .textContent =
        machineY.toFixed(2);

    document
        .getElementById("z")
        .textContent =
        machineZ.toFixed(2);

}


function setStatus(text) {

    document
        .getElementById("statusText")
        .textContent =
        text;

}


/* =========================================================
   PATH
   ========================================================= */

const pathPoints =
    [];

const pathGeometry =
    new THREE.BufferGeometry();

const pathMaterial =
    new THREE.LineBasicMaterial({

        color: 0xff4545,

        transparent: true,

        opacity: 0.8

    });

const toolPath =
    new THREE.Line(
        pathGeometry,
        pathMaterial
    );

scene.add(
    toolPath
);


function recordPath() {

    toolTip.getWorldPosition(
        toolWorld
    );

    pathPoints.push(
        toolWorld.clone()
    );


    if (
        pathPoints.length >
        1200
    ) {

        pathPoints.shift();

    }


    pathGeometry.setFromPoints(
        pathPoints
    );

}


/* =========================================================
   MACHINE STATE
   ========================================================= */

const state = {

    running: false,

    paused: false,

    stopped: false,

    time: 0,

    speed: 1

};


/* =========================================================
   AUTOMATIC SIMULATION
   ========================================================= */

function simulate(delta) {

    if (
        !state.running ||
        state.paused ||
        state.stopped
    ) {

        return;

    }


    state.time +=
        delta *
        state.speed;


    /*
     * Movimiento X
     */

    machineX =

        WORK_AREA.X / 2 +

        Math.sin(
            state.time * 0.7
        ) *
        (WORK_AREA.X * 0.38);


    /*
     * Movimiento Y
     */

    machineY =

        WORK_AREA.Y / 2 +

        Math.sin(
            state.time * 0.45
        ) *
        (WORK_AREA.Y * 0.38);


    /*
     * Movimiento Z
     */

    machineZ =

        120 +

        Math.max(
            0,
            Math.sin(
                state.time * 1.1
            )
        ) *
        220;


    clampMachine();


    /*
     * Rotación del spindle
     */

    toolRotation.rotation.y +=

        delta *
        18 *
        state.speed;


    updateHUD();

    recordPath();


    /*
     * Ciclo de demostración.
     */

    if (
        state.time >
        Math.PI * 10
    ) {

        state.running =
            false;

        setStatus(
            "COMPLETED"
        );

    }

}


/* =========================================================
   START
   ========================================================= */

document
    .getElementById("start")
    .onclick =
    () => {

        state.running =
            true;

        state.paused =
            false;

        state.stopped =
            false;

        setStatus(
            "RUNNING"
        );

    };


/* =========================================================
   PAUSE
   ========================================================= */

document
    .getElementById("pause")
    .onclick =
    () => {

        if (
            state.running
        ) {

            state.paused =
                true;

            setStatus(
                "PAUSED"
            );

        }

    };


/* =========================================================
   STOP
   ========================================================= */

document
    .getElementById("stop")
    .onclick =
    () => {

        state.running =
            false;

        state.paused =
            false;

        state.stopped =
            true;

        setStatus(
            "STOPPED"
        );

    };


/* =========================================================
   HOME
   ========================================================= */

function goHome() {

    state.running =
        false;

    state.paused =
        false;

    state.stopped =
        false;

    state.time =
        0;


    /*
     * HOME = esquina de trabajo.
     */

    machineX =
        0;

    machineY =
        0;

    machineZ =
        WORK_AREA.Z;


    toolRotation.rotation.y =
        0;


    pathPoints.length =
        0;

    pathGeometry.setFromPoints(
        []
    );


    clampMachine();

    updateHUD();

    setStatus(
        "READY"
    );

}


document
    .getElementById("home")
    .onclick =
    goHome;


/* =========================================================
   SPEED
   ========================================================= */

document
    .getElementById("speed")
    .oninput =
    event => {

        state.speed =
            parseFloat(
                event.target.value
            );

    };


/* =========================================================
   JOG STEP
   ========================================================= */

let jogStep =
    0.1;


document
    .querySelectorAll(".step")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    jogStep =
                        parseFloat(
                            button.dataset.step
                        );


                    document
                        .querySelectorAll(".step")
                        .forEach(
                            b => {

                                b.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );

                }
            );

        }
    );


/* =========================================================
   MANUAL JOG
   ========================================================= */

function jogAxis(
    axis,
    direction
) {

    state.running =
        false;

    state.paused =
        false;

    state.stopped =
        false;


    const distance =
        jogStep *
        direction;


    /*
     * X
     */

    if (
        axis === "x"
    ) {

        machineX +=
            distance;

    }


    /*
     * Y
     */

    if (
        axis === "y"
    ) {

        machineY +=
            distance;

    }


    /*
     * Z
     */

    if (
        axis === "z"
    ) {

        machineZ +=
            distance;

    }


    /*
     * Aplicar límites físicos.
     */

    clampMachine();


    updateHUD();

    setStatus(
        "JOG"
    );

}


/* =========================================================
   JOG BUTTONS
   ========================================================= */

document
    .querySelectorAll(".jog-btn")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    jogAxis(

                        button.dataset.axis,

                        parseInt(
                            button.dataset.dir
                        )

                    );

                }
            );

        }
    );


/* =========================================================
   JOG HOME
   ========================================================= */

document
    .getElementById("jogHome")
    .addEventListener(
        "click",
        goHome
    );


/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName ===
            "INPUT"
        ) {

            return;

        }


        const key =
            event.key.toLowerCase();


        if (key === "a") {

            jogAxis(
                "x",
                -1
            );

        }

        if (key === "d") {

            jogAxis(
                "x",
                1
            );

        }

        if (key === "w") {

            jogAxis(
                "y",
                1
            );

        }

        if (key === "s") {

            jogAxis(
                "y",
                -1
            );

        }

        if (key === "r") {

            jogAxis(
                "z",
                1
            );

        }

        if (key === "f") {

            jogAxis(
                "z",
                -1
            );

        }

    }
);


/* =========================================================
   INITIAL POSITION
   ========================================================= */

goHome();


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   ANIMATION
   ========================================================= */

let previous =
    performance.now();


function animate(now) {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(

            (now - previous) /
            1000,

            0.05

        );


    previous =
        now;


    simulate(
        delta
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate(
    performance.now()
);

</script>
